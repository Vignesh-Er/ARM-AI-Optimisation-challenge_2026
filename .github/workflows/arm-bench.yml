# SPDX-License-Identifier: Apache-2.0
name: ARM Benchmark & Verification

on:
  push:
    branches:
      - main
      - phase3-bench-harness
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm-bench:
    name: Build, Test & Benchmark
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            gcc \
            g++ \
            make \
            binutils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Generate fixture models & CMSIS-NN weight headers
        run: |
          python tools/train_fixture_models.py
          python tools/export_cmsisnn.py --prefix tier1
          python tools/export_cmsisnn.py --prefix tier2

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O2 -fno-fast-math -ffp-contract=off" \
            -DPACI_BUILD_TESTS=ON \
            -DPACI_BUILD_BENCH=ON

      - name: Build all C binaries & shared libraries
        run: |
          cmake --build build --parallel

      - name: Measure footprint differencing
        run: |
          mkdir -p outputs/bench
          size build/bench/core_only build/bench/core+tier1 build/bench/core+tier2 build/bench/full

      - name: Run pytest test suite
        run: |
          python -m pytest tests/ -v

      - name: Run native benchmark binary
        run: |
          mkdir -p outputs/bench
          ./build/bench/bench_main outputs/bench/aarch64-linux.json

      - name: Verify zero fixture leakage
        run: |
          python tools/check_no_fixture_in_results.py

      - name: Generate benchmark report
        run: |
          mkdir -p outputs/reports outputs/plots
          python bench/report.py outputs/bench/aarch64-linux.json --output-md outputs/reports/bench_report.md --output-plot outputs/plots/bench_breakdown.png

      - name: Publish report to Step Summary
        run: |
          if [ -f outputs/reports/bench_report.md ]; then
            cat outputs/reports/bench_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload outputs artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-outputs
          path: outputs/
          if-no-files-found: warn
